name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Check source and run unit tests
        run: npm run check
      - name: Validate Cloudflare deployment without publishing
        run: npm run deploy -- --dry-run --outdir "$RUNNER_TEMP/acnh-worker"
        env:
          WRANGLER_SEND_METRICS: "false"
