<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACNH Tracker</title>
<link rel="icon" href="favicon.png">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{--color-primary:#35634f;--color-primary-dark:#244c3b;--color-bg:#f5f3eb;--color-surface:#fffef9;--color-accent-warm:#a95531;--color-accent-cool:#6d9478;--color-text:#283e34;--color-text-muted:#536153;--color-collected:#35634f;--color-border:#dedfd3;--color-danger:#a34530;--color-shadow:rgba(35,59,42,.08);--radius-card:12px;--radius-sm:6px;--font-body:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif}

body{font-family:var(--font-body);background:var(--color-bg);color:var(--color-text);min-height:100vh;font-size:14px;font-weight:500;line-height:1.6;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}

button{font:inherit;cursor:pointer;touch-action:manipulation}
button:disabled,button[aria-disabled=true]{cursor:not-allowed;opacity:.5}
button,a,summary{ -webkit-tap-highlight-color:transparent}
button:active:not(:focus-visible):not(:disabled){transform:scale(.97)}

button:focus-visible,a:focus-visible,summary:focus-visible,.creature-item:focus-within,.today-item:focus-within{outline:2px solid var(--color-accent-warm);outline-offset:3px}

[hidden]{display:none!important}
.sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}

.skip-link{position:fixed;top:-80px;left:20px;z-index:500;padding:12px;background:var(--color-surface);color:var(--color-text)}
.skip-link:focus{top:12px}

.navbar{overflow-y:auto;position:fixed;inset:0 auto 0 0;width:216px;padding:40px 24px;background:#e8ecdf;border-right:1px solid #d4dacb;display:flex;flex-direction:column;z-index:100}

.nav-left{display:flex;flex-direction:column;gap:14px}
.brand-icon{width:42px;height:42px;object-fit:contain}
.nav-title{font-size:18px;font-weight:750;letter-spacing:-.4px}
.nav-tabs{display:flex;flex-direction:column;gap:8px;margin-top:48px}
.nav-tab{display:flex;align-items:center;gap:14px;min-height:52px;padding:10px 14px;border:0;border-radius:6px;background:transparent;color:var(--color-text-muted);text-align:left;font-weight:600}
.nav-tab.active{background:var(--color-primary);color:#fffef9}
.nav-footer{margin-top:auto;padding-top:28px;font-size:12px;color:var(--color-text-muted)}

.main{max-width:1440px;margin-left:216px;padding:42px 48px 80px}
.page-heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;gap:16px}
.page-heading h1{font-family:var(--font-body);font-size:32px;font-weight:700;line-height:1.3}

.progress-section{padding:24px 0;border-top:1px solid var(--color-text);border-bottom:1px solid var(--color-border);display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-bottom:16px}
.progress-text{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.progress-label{font-size:12px;color:var(--color-text-muted)}
.progress-pct{font-size:22px;font-weight:650}
.progress-pct small{font-size:12px;font-weight:500;color:var(--color-text-muted);margin-left:10px}
.progress-bar{height:4px;background:#dde2d5;overflow:hidden;border-radius:2px}
.progress-fill{height:100%;background:var(--color-primary)}
.progress-total .progress-fill{background:#8c9e82}
.data-bar{margin-left:auto;flex-shrink:0;position:relative;z-index:10}
.backup-menu>summary{min-height:40px;padding:8px 12px;border:1px solid var(--color-border);border-radius:6px;color:var(--color-text-muted);font-size:12px;cursor:pointer;list-style:none}
.backup-menu>summary::-webkit-details-marker{display:none}
.backup-menu>summary::after{content:"⌄";margin-left:8px}
.backup-actions{position:absolute;right:0;top:calc(100% + 8px);width:220px;display:flex;flex-direction:column;gap:8px;padding:12px;background:var(--color-surface);border:1px solid var(--color-border);border-radius:8px;box-shadow:0 6px 20px var(--color-shadow)}
.storage-mode-note{margin-right:auto;max-width:600px;font-size:12px}
.data-btn{min-height:40px;padding:6px 12px;border:1px solid var(--color-border);border-radius:6px;background:transparent;color:var(--color-text-muted);font-size:12px}

.today-panel{background:#e9ede2;margin-bottom:16px;border-radius:6px;overflow:hidden}
.today-header{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;border:0;background:transparent;color:inherit;text-align:left;min-height:56px}
.today-heading{font-size:14px;font-weight:600;display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.today-date{font-weight:500;font-size:11px;color:var(--color-text-muted)}
.today-count{font-size:12px;white-space:nowrap;color:var(--color-primary)}
.arrow{display:inline-block;font-size:9px}
.open>.arrow,.today-header.open .arrow{transform:rotate(90deg)}
.today-body{display:none;padding:0 18px 18px}
.today-body.open{display:block}
.today-info{display:flex;align-items:center;flex-wrap:wrap;gap:10px;padding:16px 0;border-top:1px solid #d3dccb;font-size:12px}
.hemi-btn{min-height:40px;padding:6px 12px;border:1px solid #c7d3be;border-radius:6px;background:transparent;color:var(--color-primary)}
.hemi-btn.active{background:var(--color-primary);color:white;border-color:var(--color-primary)}
.today-toggle{display:inline-flex;align-items:center;min-height:40px;gap:6px;font-size:12px;cursor:pointer}
.today-toggle input{accent-color:var(--color-primary);width:16px;height:16px}
.today-group-header{display:flex;align-items:center;gap:8px;min-height:40px;border:0;background:transparent;color:var(--color-primary);font-size:13px;font-weight:600}
.today-group-body{display:none}
.today-group-body.open{display:block}
.today-name{font-weight:600;min-width:80px;cursor:pointer}
.today-hours{font-size:12px;color:var(--color-text-muted)}
.today-price{color:var(--color-accent-warm);font-weight:600;margin-left:auto;white-space:nowrap}
.today-empty{font-size:13px;padding:8px 0;color:var(--color-text-muted)}
.today-item{position:relative;display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;padding:8px 0;border-bottom:1px solid #d9e0d1}

.filter-bar{margin-bottom:24px;border-bottom:1px solid var(--color-border)}
.filter-toggle-btn{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:48px;padding:8px 0;border:0;background:transparent;color:var(--color-text);font-weight:600;text-align:left}
.filter-toggle-btn::after{content:'＋';font-size:19px;font-weight:500}
.filter-toggle-btn[aria-expanded=true]::after{content:'−'}
.filter-summary{font-size:12px;font-weight:500;color:var(--color-text-muted);margin-left:16px}
.filter-panel{display:none;padding:8px 0 20px}
.filter-panel.open{display:block}
.filter-row{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.filter-row:last-child{margin-bottom:0}
.filter-label{flex:0 0 64px;font-size:12px;color:var(--color-text-muted);padding-top:10px}
.filter-options{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.filter-btn{min-height:40px;padding:6px 12px;border:1px solid var(--color-border);border-radius:6px;background:transparent;color:var(--color-text);font-size:12px;white-space:nowrap}
.filter-btn.active{background:var(--color-primary);border-color:var(--color-primary);color:#fff}
.filter-btn.month-grid{width:40px;padding:6px 0}
.filter-btn.is-now:not(.active){border-color:var(--color-accent-warm);color:var(--color-accent-warm)}
.filter-footer{display:flex;justify-content:flex-end;gap:8px}
.filter-results-btn{min-height:40px;padding:6px 12px;border:0;border-radius:6px;background:var(--color-primary);color:white;font-size:12px;font-weight:600}
.filter-reset{min-height:40px;padding:6px 12px;border:0;background:transparent;color:var(--color-danger);border-radius:6px;font-size:12px}

.list-section{background:var(--color-surface);border-top:2px solid var(--color-primary)}
.list-header{display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding:12px 18px;border-bottom:1px solid var(--color-border);font-size:12px}
.sort-btn{min-height:40px;padding:6px 10px;border:0;border-radius:6px;background:transparent;color:var(--color-text-muted);font-size:12px}
.sort-btn[aria-pressed=true]{color:var(--color-primary);background:#e9ede2}
.filter-result-count{font-size:12px;font-weight:500;color:var(--color-text-muted);margin-left:10px}
.bulk-actions{display:flex;gap:6px}
.list-header .data-btn{font-size:12px}

.creature-item{padding:20px;border-bottom:1px solid var(--color-border)}
.creature-row{display:grid;grid-template-columns:24px 72px minmax(0,1fr);gap:4px 18px;align-items:center;cursor:pointer}
.collect-toggle{display:flex;cursor:pointer}
.creature-main,.creature-meta,.art-title-group{cursor:pointer}
.creature-thumbnail>label,.art-thumbnail-frame>label{display:flex;width:100%;height:100%;cursor:pointer}
.check-box{width:24px;height:24px;border:1.5px solid #a9b4a1;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.check-box::after{content:'✓';font-size:14px;color:white;opacity:0}
.creature-item.collected .check-box,.today-item.collected .check-box{background:var(--color-collected);border-color:var(--color-collected)}
.creature-item.collected .check-box::after,.today-item.collected .check-box::after{opacity:1}
.creature-item.collected{background:#f0f3e9}
.creature-item.collected .creature-name{color:#627b63}
.creature-thumbnail{grid-column:2;grid-row:1/3;width:72px;height:72px;display:flex;align-items:center;justify-content:center;background:#f0f1e8;border-radius:8px}
.creature-thumbnail img{width:100%;height:100%;object-fit:contain}
.creature-image-error{padding:4px;font-size:11px;text-align:center;color:var(--color-text-muted)}
.creature-main{display:flex;align-items:center;flex-wrap:wrap;gap:5px 8px;min-width:0;grid-column:3}
.creature-name{font-size:16px;font-weight:650;line-height:1.5;margin-right:4px}
.tag{padding:2px 6px;border-radius:4px;font-size:12px;white-space:nowrap;font-weight:600}
.tag-location{background:#eaf0e5;color:#496445}
.tag-shadow{background:#f3eddf;color:#81653b}
.tag-weather{background:#e7eef0;color:#4e6b75}
.tag-price{font-size:12px;color:var(--color-text-muted);white-space:nowrap}
.note{font-size:12px;color:var(--color-text-muted);font-style:normal}
.creature-meta{grid-column:3;display:flex;flex-direction:column;gap:5px}
.meta-row{display:flex;align-items:center;flex-wrap:wrap;gap:3px;font-size:11px}
.meta-label{color:var(--color-text-muted);min-width:28px}
.meta-hours{color:var(--color-text);font-size:12px;font-weight:600}
.heat-cell{display:inline-flex;align-items:center;justify-content:center;width:20px;height:22px;border-radius:3px;background:#eeeee6;color:#657060;font-size:11px;font-weight:600}
.heat-cell.on{background:var(--color-primary);color:#fffef9;font-weight:700}
.heat-cell.current{outline:2px solid var(--color-accent-warm);outline-offset:1px}
.empty-state{padding:64px 24px;text-align:center;color:var(--color-text-muted);font-size:14px}

.villager-item{display:grid;grid-template-columns:80px minmax(0,1fr);gap:18px;align-items:center}
.villager-portrait{display:flex;width:80px;height:96px;background:#f0f1e8;border-radius:6px;overflow:hidden}
.villager-portrait img{width:100%;height:100%;object-fit:contain}
.villager-info{min-width:0}
.villager-title{display:flex;flex-wrap:wrap;gap:5px 10px;align-items:baseline;overflow-wrap:anywhere}
.villager-english{font-size:12px;color:var(--color-text-muted)}
.villager-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.villager-facts{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:8px;font-size:12px;line-height:1.8;overflow-wrap:anywhere}
.villager-item .art-source-link{display:inline-block;min-height:40px;padding-top:8px}
.music-item{display:grid;grid-template-columns:24px 88px minmax(0,1fr);gap:18px;align-items:center}
.music-cover{display:flex;width:88px;height:88px;background:#f0f1e8;border-radius:6px;overflow:hidden}
.music-cover img{width:100%;height:100%;object-fit:contain}
.music-info{min-width:0}
.music-title{display:flex;flex-direction:column;gap:5px;cursor:pointer;overflow-wrap:anywhere}
.music-english,.music-price{font-size:12px;color:var(--color-text-muted)}
.music-tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.music-details{font-size:12px;line-height:1.8}
.music-details summary{padding:8px 0;min-height:40px;width:fit-content;cursor:pointer;color:var(--color-primary)}
.music-details p{margin-top:6px}
.art-item{display:block}
.art-collect{display:grid;grid-template-columns:24px 88px minmax(0,1fr);align-items:center;gap:18px;cursor:pointer}
.art-thumbnail-frame{display:flex;align-items:center;justify-content:center;width:88px;height:96px;background:#f0f1e8;border-radius:6px}
.art-thumbnail-frame img{width:100%;height:100%;object-fit:contain}
.art-title-group{display:flex;flex-direction:column;gap:8px;min-width:0}
.art-title-line{display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.art-real-name{font-size:12px;color:var(--color-text-muted);line-height:1.7}
.art-details{margin:4px 0 0 148px}
.art-details summary{padding:8px 0;min-height:40px;width:fit-content;max-width:100%;font-size:12px;color:var(--color-primary);cursor:pointer}
.art-detail-body{padding:14px 0}
.art-clues{display:grid;gap:8px;font-size:13px;line-height:1.8}
.art-clues strong{margin-right:12px}
.art-comparisons{display:flex;flex-wrap:wrap;gap:16px;margin:16px 0}
.art-comparisons figure{flex:1 1 150px;max-width:250px;min-width:0}
.art-comparisons figcaption{font-size:12px;margin-bottom:8px}
.art-comparison-frame{display:flex;align-items:center;justify-content:center;aspect-ratio:3/4;background:#f0f1e8;border-radius:6px;overflow:hidden}
.art-comparison-frame img{width:100%;height:100%;object-fit:contain}
.art-image-error{padding:10px;font-size:12px;text-align:center;color:var(--color-text-muted)}
.art-source-link{display:inline-block;padding:8px 0;color:var(--color-primary);font-size:12px;text-underline-offset:4px}

.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,12px);padding:12px 20px;background:var(--color-text);color:var(--color-surface);border-radius:8px;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s;z-index:200;max-width:calc(100vw - 32px);display:flex;align-items:center;gap:12px;font-size:13px;box-shadow:0 4px 18px var(--color-shadow)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast-action{min-height:40px;padding:6px 12px;background:#4a6655;color:#fff;border:0;border-radius:6px;font-size:13px;white-space:nowrap}
.modal-overlay{position:fixed;inset:0;background:rgba(29,43,33,.35);display:flex;align-items:center;justify-content:center;z-index:300;opacity:0;transition:opacity .15s}
.modal-overlay.show{opacity:1}
.modal{width:calc(100vw - 40px);max-width:380px;background:var(--color-surface);border-radius:12px;padding:24px;box-shadow:0 16px 60px rgba(20,35,25,.2)}
.modal-msg{font-size:14px;line-height:1.8;margin-bottom:24px}
.modal-btns{display:flex;justify-content:flex-end;gap:8px}
.modal-btn{min-height:40px;padding:8px 16px;border:1px solid var(--color-border);border-radius:6px;background:transparent;color:var(--color-text)}
.modal-btn-confirm{background:var(--color-primary);color:white;border-color:var(--color-primary)}

.image-fallback{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;font-size:10px;line-height:1.2}
.image-retry{min-height:40px;padding:4px;border:0;border-radius:4px;background:transparent;color:var(--color-primary);font-size:11px;font-weight:600}
.art-comparison-frame>a{display:flex;width:100%;height:100%;align-items:center;justify-content:center}
@media(hover:hover){.nav-tab:not(.active):hover{background:#dce4d2}
.data-btn:hover,.filter-btn:not(.active):hover,.sort-btn:hover{background:#e9ede2;color:var(--color-primary)}
.today-header:hover{background:#e1e8d8}
.creature-item:hover{background:#f4f6ee}
.filter-reset:hover{background:#f5e8de}
}

@media(min-width:1500px){.main{margin-right:auto;margin-left:max(216px,calc((100vw - 1224px)/2));max-width:1224px}
}

@media(max-width:1100px){.navbar{width:180px;padding:32px 18px}
.main{margin-left:180px;padding:32px 28px}
.progress-section{gap:24px}
.progress-pct{font-size:19px}
.progress-pct small{display:none}
}

@media(max-width:760px){.navbar{position:sticky;inset:auto;top:0;width:100%;padding:10px 20px 0;border-right:0;border-bottom:1px solid #d4dacb;gap:8px}
.nav-left{flex-direction:row;align-items:center;gap:10px}
.brand-icon{width:28px;height:28px}
.nav-title{font-size:15px}
.nav-footer{display:none}
.nav-tabs{flex-direction:row;flex-wrap:wrap;margin:0;gap:4px}
.nav-tab{flex:1 1 calc((100% - 8px)/3);justify-content:center;padding:6px 4px;min-height:40px;border-radius:6px 6px 0 0;font-size:13px;gap:6px}
.main{margin:0;padding:14px 20px 48px}
.page-heading{margin-bottom:12px;gap:12px}
.page-heading h1{font-size:27px}
.progress-section{gap:20px;padding:12px 0;margin-bottom:12px}
.progress-text{flex-direction:row;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.progress-pct{font-size:20px}
.data-bar{margin-bottom:0}
.today-panel{margin-bottom:8px}
.filter-bar{margin-bottom:16px}
.today-header{align-items:flex-start;padding:10px 14px}
.today-heading{font-size:13px}
.today-date{display:block;flex-basis:100%;padding-left:17px}
.today-count{font-size:11px;padding-top:2px}
.today-body{padding:0 14px 14px}
.filter-summary{display:block;margin:2px 0 0;font-size:11px}
.creature-item,.filter-toggle-btn{scroll-margin-top:144px}
.filter-row{gap:8px}
.filter-label{flex-basis:52px}
.filter-btn{padding:6px 10px}
.list-header{padding:10px 12px;gap:4px}
.list-header .data-btn{padding:6px 8px}
.bulk-actions{margin-left:auto}
.creature-item{padding:16px 12px}
.creature-row{grid-template-columns:22px 56px minmax(0,1fr);gap:8px 10px;align-items:start}
.check-box{width:22px;height:22px;margin-top:2px}
.creature-thumbnail{width:56px;height:56px;grid-row:1}
.creature-main{gap:4px 6px}
.creature-name{font-size:15px;flex-basis:100%}
.creature-meta{grid-column:2/-1}
.heat-cell{width:18px;height:22px}
.meta-row{gap:2px}
.meta-label{min-width:22px}
.villager-item{grid-template-columns:56px minmax(0,1fr);gap:10px}
.villager-portrait{width:56px;height:76px}
.music-item{grid-template-columns:22px 64px minmax(0,1fr);gap:10px}
.music-cover{width:64px;height:64px}
.art-collect{grid-template-columns:22px 64px minmax(0,1fr);gap:10px}
.art-thumbnail-frame{width:64px;height:80px}
.art-title-line{gap:4px}
.art-title-line .tag{font-size:11px}
.art-details{margin-left:32px}
.art-comparisons{gap:10px}
.art-comparisons figure{flex-basis:calc(50% - 5px);max-width:100%}
.storage-mode-note{flex-basis:100%}
.toast{bottom:16px}
}

@media(max-width:360px){.main{padding:10px 12px 40px}
.navbar{padding-left:12px;padding-right:12px}
.heat-cell{width:16px}
.meta-label{min-width:20px}
.sort-btn{padding:6px 8px}
}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;scroll-behavior:auto!important}
button:active:not(:focus-visible):not(:disabled){transform:none}
}

</style>
</head>
<body>

<a class="skip-link" href="#main-content">跳到图鉴</a>
<nav class="navbar" aria-label="收集类别">
  <div class="nav-left">
    <img class="brand-icon" src="favicon.png" alt="" width="42" height="42">
    <span class="nav-title">ACNH Tracker</span>
  </div>
  <div class="nav-tabs" id="navTabs" role="group" aria-label="选择收集类别"></div>
  <div class="nav-footer">集合啦！动物森友会</div>
</nav>

<main class="main" id="main-content" tabindex="-1">
  <header class="page-heading"><h1 id="collectionTitle">我的图鉴</h1><div class="data-bar" id="dataBar"></div></header>
  <div class="progress-section" id="progressSection" aria-live="polite"></div>
  <div class="today-panel" id="todayPanel"></div>
  <div class="filter-bar" id="filterBar"></div>
  <div class="list-section" id="listSection"></div>
</main>

<script src="bundle.js" defer></script>
</body>
</html>
